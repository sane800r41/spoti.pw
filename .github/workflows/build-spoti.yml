
name: Build spoti.pw 0.51 IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct HTTPS URL to decrypted Spotify IPA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inject:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout upstream release
        uses: actions/checkout@v4
        with:
          repository: skopevoj/spoti.pw
          ref: v0.51.0-beta.1
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -euo pipefail

          brew install dpkg ldid pipx

          pipx install \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          cyan --help

      - name: Download Spotify IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail

          echo "::add-mask::$IPA_URL"

          case "$IPA_URL" in
            https://*) ;;
            *)
              echo "::error::An HTTPS URL is required"
              exit 1
              ;;
          esac

          mkdir -p ipa out

          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            "$IPA_URL" \
            -o ipa/spotify.ipa

          unzip -tq ipa/spotify.ipa

          unzip -Z1 ipa/spotify.ipa \
            | grep -qE '^Payload/[^/]+\.app/Info.plist$' \
            || {
              echo "::error::Invalid Spotify IPA"
              exit 1
            }

      - name: Download compiled 0.51 beta tweak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/spoti-release

          gh release download v0.51.0-beta.1 \
            --repo skopevoj/spoti.pw \
            --pattern 'spoti.pw-0.51.0-beta.1.deb' \
            --dir /tmp/spoti-release \
            --clobber

          DEB="/tmp/spoti-release/spoti.pw-0.51.0-beta.1.deb"

          test -s "$DEB"

          echo "Downloaded package:"
          ls -lh "$DEB"

          echo "Package metadata:"
          dpkg-deb -f "$DEB" \
            Package Version Architecture

          VERSION="$(dpkg-deb -f "$DEB" Version)"

          case "$VERSION" in
            *0.51*)
              echo "Confirmed 0.51 release"
              ;;
            *)
              echo "::error::Unexpected version: $VERSION"
              exit 1
              ;;
          esac

          cp "$DEB" /tmp/spoti.pw-0.51.deb

      - name: Inject tweak into Spotify
        run: |
          set -euo pipefail

          cyan \
            -i ipa/spotify.ipa \
            -o out/spoti.pw-0.51.0-beta.1.ipa \
            -f /tmp/spoti.pw-0.51.deb \
            -l plist/liquid-glass.plist \
            -w -s --overwrite

      - name: Verify output IPA
        run: |
          set -euo pipefail

          IPA="out/spoti.pw-0.51.0-beta.1.ipa"

          test -s "$IPA"
          unzip -tq "$IPA"

          echo "Output IPA:"
          ls -lh "$IPA"

          echo "Build completed successfully"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: spoti-pw-051-unsigned-ipa
          path: out/spoti.pw-0.51.0-beta.1.ipa
          if-no-files-found: error
          retention-days: 3
